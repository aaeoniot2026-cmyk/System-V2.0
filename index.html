<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>工單拍照上傳</title>
<style>
:root{--bg:#111418;--card:#1e232a;--tx:#f2f4f7;--mu:#9aa4b2;--ac:#3b82f6;--ok:#22c55e;--er:#ef4444;--wn:#f59e0b;--bd:#323a45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans TC","PingFang TC",sans-serif;overflow:hidden}
section{display:none;position:fixed;inset:0;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
section.on{display:flex}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
button:disabled{opacity:.4}

/* 1 輸入工單 */
#s1{justify-content:flex-start;align-items:center;padding:calc(10px + env(safe-area-inset-top,0)) 12px 12px}
.box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.box h1{font-size:22px;margin:0 0 14px}
.row{display:flex;gap:8px}
input[readonly]{opacity:.65}
input{width:100%;height:76px;font-size:22px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
#go{width:100%;margin-top:14px;font-size:20px;padding:14px;background:var(--ok)}
details{margin-top:14px;color:var(--mu);font-size:14px}
details input{font-size:14px;margin-top:8px}
summary{cursor:pointer}

/* 2 相機 */
#s2{background:#000}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.6)}
.top b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{padding:8px 12px;font-size:15px}
#s2 .top{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;z-index:3;align-items:flex-start;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0))}
#s2 .top b{white-space:pre-line;font-size:17px;line-height:1.4;text-shadow:0 1px 3px #000}
#vw{flex:1;min-height:0;position:relative;overflow:hidden;background:#000;touch-action:none}
#v{display:block;width:100%;height:100%;object-fit:contain;transform-origin:center;will-change:transform}
#zpill{display:none;position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:3;padding:6px 12px;font-size:15px;background:rgba(0,0,0,.6);border:1px solid #fff}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:rgba(0,0,0,.6)}
#thumb{position:relative;width:64px;height:64px;border-radius:10px;border:2px solid #fff;background:#222 center/cover no-repeat;padding:0;overflow:visible}
#cnt{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--ac);font-size:13px;line-height:22px;text-align:center}
#st{position:absolute;bottom:-6px;left:-6px;font-size:16px}
#shot{width:78px;height:78px;border-radius:50%;background:#fff;border:6px solid #888;padding:0}
#shot:active{transform:scale(.93)}
.bar>.l,.bar>.r{flex:1;display:flex}
.bar>.r{flex-direction:column;align-items:flex-end;gap:6px}
.bar>.r button{padding:9px 12px;font-size:15px;min-width:92px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}

/* 3 檢視 */
#s3{background:#000}
#pinfo{position:absolute;left:8px;top:8px;z-index:2;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1.4;pointer-events:none;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
#big{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-drag:none}
.bot{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px;background:rgba(0,0,0,.6)}
.bot button{padding:10px 14px}
#zp{min-width:56px;text-align:center}

/* 輸入框內直接掃描 */
.fld{position:relative;flex:1;min-width:0}
.fld input{display:block}
#scanBox{display:none;position:absolute;inset:0;border-radius:10px;overflow:hidden;background:#000;cursor:pointer;z-index:2}
#scanBox #sv,#scanBox #reader{width:100%;height:100%;object-fit:cover;display:block;overflow:hidden}
#scanBox #reader video{width:100%!important;height:100%!important;object-fit:cover}
#ocrBox{display:none;position:absolute;left:var(--fl,4%);width:var(--fw,92%);top:var(--ft,14%);height:var(--fh,72%);border:3px solid #ef4444;border-radius:6px;pointer-events:none;z-index:1;box-sizing:border-box}
#scanHint{position:absolute;left:6px;bottom:4px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:1px 8px;border-radius:8px;pointer-events:none}

/* 上傳結果視窗 */
#res{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;align-items:center;justify-content:center;padding:16px}
.rbox{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;width:100%;max-width:460px;max-height:85vh;display:flex;flex-direction:column}
.rbox h2{font-size:19px;margin:0 0 6px}
#rs{font-size:15px;line-height:1.6}
#rl{overflow:auto;margin:10px 0;flex:1;min-height:0}
.ri{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
.ri img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.ri span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{display:flex;gap:8px;flex-wrap:wrap}
.rb button{flex:1;padding:11px 10px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>

<!-- 1. 輸入工單/序號 -->
<section id="s1" class="on">
  <div class="box">
    <h1 id="h1s">📋 工單／序號</h1>
    <div style="font-size:13px;color:var(--mu);margin-bottom:10px">輸入框會直接開啟掃描，<b>點一下框</b>即可改為手動輸入；📷 可重新掃描</div>
    <label style="font-size:14px;color:var(--mu)">工單（必填）→ 第一層資料夾</label>
    <div class="row" style="margin:4px 0 12px">
      <div class="fld"><input id="order" placeholder="掃描或輸入工單" autocomplete="off" autocapitalize="characters" enterkeyhint="next"></div>
      <button class="g" id="scanOrder">📷</button>
    </div>
    <label style="font-size:14px;color:var(--mu)">序號（選填）→ 第二層資料夾，不填則直接存在工單資料夾</label>
    <div class="row" style="margin-top:4px">
      <div class="fld"><input id="serial" placeholder="掃描或輸入序號（可不填）" autocomplete="off" autocapitalize="characters" enterkeyhint="go"></div>
      <button class="g" id="scanSerial">📷</button>
    </div>
    <div id="pend" style="display:none;margin-top:14px;height:76px;padding:0 12px;box-sizing:border-box;border-radius:10px;border:1px solid var(--ok);background:rgba(34,197,94,.12);color:var(--tx);font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer;align-items:center;justify-content:center;text-align:center"></div>
    <button id="go">開始照相</button>
    <button class="g" id="finishS1" style="display:none;width:100%;margin-top:10px;color:var(--er)">結束工單（全部完成）</button>
    <details id="setBox" open>
      <summary>⚙️ 設定</summary>
      <label style="display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--tx);cursor:pointer">
        <input type="checkbox" id="ocrOn" autocomplete="off" style="width:22px;height:22px;flex:none;margin:0">
        <span>啟用文字 OCR（只擷取 Job: 後、第一個 - 之前的工單）</span>
      </label>
      <div id="frmSet" style="margin-top:10px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px">
        <span>紅框寬</span><input type="range" id="fW" min="30" max="100" step="1" style="height:auto;padding:0;margin:0"><span id="fWv"></span>
        <span>紅框高</span><input type="range" id="fH" min="20" max="100" step="1" style="height:auto;padding:0;margin:0"><span id="fHv"></span>
        <span>上下位置</span><input type="range" id="fT" min="0" max="100" step="1" style="height:auto;padding:0;margin:0"><span id="fTv"></span>
        <span>最小圖片</span><input type="number" id="fK" min="0" max="100" step="1" inputmode="numeric" style="height:auto;font-size:14px;padding:4px 8px;margin:0"><span>KB</span>
      </div>
      <div id="ocrLog" style="display:none;margin-top:10px;font-size:12px;line-height:1.5;font-family:monospace;color:var(--mu);word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-height:2.5em">OCR 紀錄：尚無</div>
    </details>
    <div id="scanBox"><video id="sv" autoplay playsinline muted></video><div id="reader" style="display:none"></div><div id="ocrBox"></div><div id="scanHint">掃描中…點此手動輸入</div></div>
  </div>
</section>

<!-- 2. 相機 -->
<section id="s2">
  <div class="top"><b id="title"></b><button class="g" id="flip">🔄 切換鏡頭</button></div>
  <div id="vw"><video id="v" autoplay playsinline muted></video></div>
  <button id="zpill">還原</button>
  <div id="flash"></div>
  <div class="bar">
    <div class="l"><button id="thumb" aria-label="檢視照片"><span id="cnt">0</span><span id="st"></span></button></div>
    <button id="shot" aria-label="拍照"></button>
    <div class="r">
      <button class="g" id="nextSN">下一個序號</button>
      <button id="finish" style="background:var(--er)">結束</button>
    </div>
  </div>
</section>

<!-- 3. 檢視 -->
<section id="s3">
  <div class="top"><button class="g" id="back">← 返回</button><b id="info"></b><button id="del" style="background:var(--er)">🗑 刪除</button></div>
  <div id="stage"><img id="big" alt="照片"><div id="pinfo"></div></div>
  <div class="bot">
    <button class="g" id="prev">◀</button>
    <button class="g" id="zo">－</button><span id="zp">100%</span><button class="g" id="zi">＋</button>
    <button class="g" id="next">▶</button>
    <button class="g" id="retry" style="display:none">重新上傳</button>
  </div>
</section>

<div id="res"><div class="rbox">
  <h2 id="rt"></h2><div id="rs"></div><div id="rl"></div>
  <div class="rb"><button class="g" id="rBack">返回拍照</button><button class="g" id="rRetry" style="display:none">重新上傳失敗</button><button id="rOk"></button></div>
</div></div>
<div id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyemkdI2il0i8lpFs-JuPy8y6JUa5VOiXvFucTTuNdOxAe-fnSd5PrYqR5BEbARzLAY/exec'; // Apps Script 網址（要更換時改這行）
const $ = id => document.getElementById(id);
const v=$('v'), big=$('big');
let resMode=null, orderActive=false, order='', serial='', photos=[], stream=null, facing='environment', cur=0, seq=0;

/* ---------- 共用 ---------- */
function show(id){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on', s.id===id || (id==='s3' && s.id==='s2')));
  if(id==='s2') ensureCam();
}
let tt; function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(tt); tt=setTimeout(()=>e.style.display='none',2500); }
function cleanName(s){ return s.trim().replace(/[\\\/:*?"<>|]/g,'_'); }
function gasUrl(){ return GAS_URL; }
function b64(blob){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(r.result.split(',')[1]); r.onerror=no; r.readAsDataURL(blob); }); }
async function api(body){
  const r = await fetch(gasUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'失敗'); return j;
}
const ICON={up:'⏳',ok:'✅',err:'⚠️'};

/* 拍照快門聲（WebAudio 合成，不需音檔；需在使用者點擊後才能發聲） */
let actx=null;
function shutterSound(){
  try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const click=(t0,freq,dur,vol)=>{
      const n=Math.floor(actx.sampleRate*dur), buf=actx.createBuffer(1,n,actx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
      const src=actx.createBufferSource(); src.buffer=buf;
      const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=0.9;
      const g=actx.createGain(); g.gain.value=vol;
      src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(actx.currentTime+t0);
    };
    click(0,3200,0.05,1.0);        // 喀
    click(0.07,1800,0.08,0.9);     // 嚓
  }catch(e){}
}

/* 連續自動對焦（手機支援才會生效，不支援會自動忽略） */
const AF={focusMode:'continuous'};
async function autoFocus(track){
  try{
    const c=track.getCapabilities?track.getCapabilities():{};
    if(c.focusMode && c.focusMode.includes('continuous')) await track.applyConstraints({advanced:[AF]});
  }catch(e){}
}

/* ---------- 1. 開始 ---------- */
$('order').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if($('order').value.trim()) startScan('serial'); } });
$('serial').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('go').click(); } });
$('go').onclick=async()=>{
  cancelGo();
  const o=cleanName($('order').value), sn=cleanName($('serial').value);
  if(!o){ toast('請先輸入或掃描工單'); $('order').focus(); return; }
  order=o; serial=sn; orderActive=true; photos=[]; seq=0; renderThumb();
  $('title').textContent='工單：'+order+'\n序號：'+(serial||'（未填）');
  await closeScan();
  resetZoom(); show('s2'); openCam();
  if(!window._zhint){ window._zhint=1; toast('雙指縮放或雙擊可放大，放大後拖曳選擇拍攝區域'); }
};

/* ---------- 2. 相機 ---------- */
function stopCam(){
  if(stream){ stream.getTracks().forEach(t=>{ t.onended=null; t.stop(); }); stream=null; }
}
async function openCam(){
  stopCam();
  let st=null;
  const tries=[
    {video:{facingMode:facing,width:{ideal:4096},height:{ideal:2160},advanced:[AF]},audio:false},
    {video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false},
    {video:{facingMode:facing},audio:false},
    {video:true,audio:false}
  ];
  for(const c of tries){ try{ st=await navigator.mediaDevices.getUserMedia(c); break; }catch(e){} }
  if(!st){ toast('無法開啟相機：請允許權限，並確認是 https 網址'); return; }
  stream=st; v.srcObject=st; resetZoom();
  const t=st.getVideoTracks()[0];
  autoFocus(t);
  t.onended=()=>{ if(stream===st){ toast('相機中斷，重新啟動中…'); setTimeout(openCam,300); } };
  try{ await v.play(); }catch(e){}
}
function camLive(){
  const t=stream&&stream.getVideoTracks()[0];
  return !!t && t.readyState==='live' && !t.muted && !v.paused && v.videoWidth>0 && v.readyState>=2;
}
async function ensureCam(){
  if(!$('s2').classList.contains('on')) return;
  if(camLive()) return;
  const t=stream&&stream.getVideoTracks()[0];
  if(t && t.readyState==='live'){ try{ await v.play(); }catch(e){} await new Promise(r=>setTimeout(r,300)); if(camLive()) return; }
  await openCam();
}
v.addEventListener('pause',()=>{ if(stream && $('s2').classList.contains('on')) v.play().catch(()=>{}); });
$('flip').onclick=()=>{ facing=facing==='environment'?'user':'environment'; openCam(); };

function resetShoot(){ photos.forEach(p=>URL.revokeObjectURL(p.url)); photos=[]; stopCam(); }

/* 下一個序號：回到同一張工單，自動掃描下一個序號 */
function doNext(){
  resetShoot(); serial='';
  $('serial').value=''; $('order').value=order; $('order').readOnly=true;
  $('h1s').textContent='📋 下一個序號（工單：'+order+'）';
  $('finishS1').style.display='';
  show('s1'); startScan('serial');
}
/* 結束：整張工單完成，回到最初畫面 */
function doFinish(){
  resetShoot(); order=''; serial=''; orderActive=false;
  $('order').value=''; $('serial').value=''; $('order').readOnly=false;
  $('h1s').textContent='📋 工單／序號'; $('finishS1').style.display='none';
  show('s1'); startScan('order');
}
$('finishS1').onclick=()=>{ if(confirm('確定結束工單 '+order+'？')) doFinish(); };

/* ---------- 上傳結果視窗 ---------- */
function openRes(m){ resMode=m; $('res').style.display='flex'; renderRes(); }
function closeRes(){ resMode=null; $('res').style.display='none'; }
function renderRes(){
  if(!resMode) return;
  const n=photos.length, up=photos.filter(p=>p.state==='up').length,
        ok=photos.filter(p=>p.state==='ok').length, er=photos.filter(p=>p.state==='err').length;
  $('rt').textContent = resMode==='next' ? '下一個序號 — 上傳結果' : '結束工單 — 上傳結果';
  let msg = up ? '⏳ 上傳中，請稍候…' : er ? '⚠️ 有照片上傳失敗，請重新上傳' : n ? '🎉 全部上傳成功' : '本次沒有拍照';
  $('rs').innerHTML = '工單：<b></b>'+(serial?'　序號：<b></b>':'')+'<br>共 '+n+' 張：✅ '+ok+' 成功　⏳ '+up+' 上傳中　⚠️ '+er+' 失敗<br><b>'+msg+'</b>';
  const bs=$('rs').querySelectorAll('b'); bs[0].textContent=order; if(serial) bs[1].textContent=serial;
  $('rl').innerHTML='';
  photos.forEach(p=>{
    const d=document.createElement('div'); d.className='ri';
    const im=document.createElement('img'); im.src=p.url;
    const nm=document.createElement('span'); nm.textContent=p.name+(p.state==='err'&&p.msg?'（'+p.msg+'）':'');
    const ic=document.createElement('em'); ic.textContent=ICON[p.state]; ic.style.fontStyle='normal';
    d.append(im,nm,ic); $('rl').appendChild(d);
  });
  $('rRetry').style.display = er?'':'none';
  $('rOk').textContent = up ? '上傳中…' : (resMode==='next' ? '確認，下一個序號' : '確認，結束工單');
  $('rOk').disabled = up>0;
}
$('rBack').onclick=closeRes;
$('rRetry').onclick=()=>{ photos.filter(p=>p.state==='err').forEach(p=>upload(p)); };
$('rOk').onclick=()=>{
  const er=photos.filter(p=>p.state==='err').length;
  if(er && !confirm('仍有 '+er+' 張上傳失敗，離開後無法重傳，確定繼續？')) return;
  const m=resMode; closeRes();
  if(m==='next') doNext(); else doFinish();
};
$('nextSN').onclick=()=>openRes('next');
$('finish').onclick=()=>openRes('finish');

$('shot').onclick=async()=>{
  if(!camLive()){ toast('相機重新啟動中，請稍候再拍'); await ensureCam(); return; }
  // 取得目前畫面上看到的區域（對應到相機原始像素）
  const dm=dims(), cw=dm.dw*Z, ch=dm.dh*Z;
  const cx0=dm.W/2+PX-cw/2, cy0=dm.H/2+PY-ch/2;
  const x0=Math.max(0,cx0), y0=Math.max(0,cy0), x1=Math.min(dm.W,cx0+cw), y1=Math.min(dm.H,cy0+ch);
  const sx=(x0-cx0)/cw*dm.w, sy=(y0-cy0)/ch*dm.h, sw=(x1-x0)/cw*dm.w, sh=(y1-y0)/ch*dm.h;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw)); c.height=Math.max(1,Math.round(sh));
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  shutterSound();
  const f=$('flash'); f.style.opacity=.8; setTimeout(()=>f.style.opacity=0,120);
  c.toBlob(blob=>{
    const d=new Date(), z=n=>String(n).padStart(2,'0');
    const name=[order,serial].filter(Boolean).join('_')+'_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+'_'+(++seq)+'.jpg';
    const it={blob,url:URL.createObjectURL(blob),name,order,serial,state:'up',id:null,deleted:false};
    photos.push(it); renderThumb(); upload(it);
    c.width=c.height=0;
  },'image/jpeg',0.95);
};

/* ---------- 拍照區放大（可雙指縮放、拖曳選區） ---------- */
const vw=$('vw'); let Z=1, PX=0, PY=0;
function dims(){
  const W=vw.clientWidth, H=vw.clientHeight, w=v.videoWidth||W, h=v.videoHeight||H, f=Math.min(W/w,H/h);
  return {W,H,w,h,dw:w*f,dh:h*f};
}
function applyZ(){
  const d=dims(), mx=Math.max(0,(d.dw*Z-d.W)/2), my=Math.max(0,(d.dh*Z-d.H)/2);
  PX=Math.min(mx,Math.max(-mx,PX)); PY=Math.min(my,Math.max(-my,PY));
  v.style.transform='translate('+PX+'px,'+PY+'px) scale('+Z+')';
  const pl=$('zpill');
  if(Z>1.01){ pl.style.display='block'; pl.textContent='🔍 ×'+Z.toFixed(1)+'　點此還原'; } else pl.style.display='none';
}
function resetZoom(){ Z=1; PX=0; PY=0; applyZ(); }
function zoomAt(nz,fx,fy){
  nz=Math.min(6,Math.max(1,nz)); const r=nz/Z;
  PX=fx-(fx-PX)*r; PY=fy-(fy-PY)*r; Z=nz;
  if(Z<=1){ Z=1; PX=0; PY=0; }
  applyZ();
}
function rel(e){ const r=vw.getBoundingClientRect(); return {x:e.clientX-r.left-r.width/2, y:e.clientY-r.top-r.height/2}; }
const zp=new Map(); let zd0=0, zLast=null, zTap=0;
vw.addEventListener('pointerdown',e=>{
  vw.setPointerCapture(e.pointerId); zp.set(e.pointerId,rel(e));
  if(zp.size===2){ const [a,b]=[...zp.values()]; zd0=Math.hypot(a.x-b.x,a.y-b.y)||1; zLast={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
  if(zp.size===1){ const n=Date.now(); if(n-zTap<300){ if(Z>1) resetZoom(); else { const q=rel(e); zoomAt(2.5,q.x,q.y); } } zTap=n; }
});
vw.addEventListener('pointermove',e=>{
  const o=zp.get(e.pointerId); if(!o) return;
  const n=rel(e);
  if(zp.size===2){
    zp.set(e.pointerId,n);
    const [a,b]=[...zp.values()], mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}, dist=Math.hypot(a.x-b.x,a.y-b.y)||1;
    zoomAt(Z*dist/zd0,mid.x,mid.y); zd0=dist;
    PX+=mid.x-zLast.x; PY+=mid.y-zLast.y; zLast=mid; applyZ();
  }else{
    zp.set(e.pointerId,n);
    if(Z>1){ PX+=n.x-o.x; PY+=n.y-o.y; applyZ(); }
  }
});
['pointerup','pointercancel'].forEach(t=>vw.addEventListener(t,e=>{ zp.delete(e.pointerId); }));
vw.addEventListener('wheel',e=>{ e.preventDefault(); const q=rel(e); zoomAt(Z*(e.deltaY<0?1.15:1/1.15),q.x,q.y); },{passive:false});
$('zpill').onclick=resetZoom;
window.addEventListener('resize',applyZ);

const queue=[]; let busy=false;
function upload(it){ it.state='up'; renderThumb(); if($('s3').classList.contains('on')) renderReview(); queue.push(it); pump(); }
async function pump(){
  if(busy) return; busy=true;
  while(queue.length){ const it=queue.shift(); if(it.deleted) continue; await doUpload(it); }
  busy=false;
}
async function doUpload(it){
  try{
    const j=await api({action:'upload',order:it.order,serial:it.serial,name:it.name,data:await b64(it.blob)});
    it.id=j.id; it.state='ok';
    if(it.deleted){ api({action:'delete',id:it.id}).catch(()=>{}); }
  }catch(e){ it.state='err'; it.msg=String(e&&e.message||e); toast('⚠️ 上傳失敗，請查看結果並重新上傳'); }
  renderThumb(); if($('s3').classList.contains('on')) renderReview();
}

function renderThumb(){
  renderRes();
  const last=photos[photos.length-1];
  $('thumb').style.backgroundImage = last?`url(${last.url})`:'none';
  $('cnt').textContent=photos.length;
  $('st').textContent = last?ICON[last.state]:'';
}
$('thumb').onclick=()=>{ if(!photos.length){ toast('尚未拍照'); return; } cur=photos.length-1; openReview(); };

/* ---------- 3. 檢視（縮放） ---------- */
let sc=1,tx=0,ty=0;
function applyT(){ big.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`; $('zp').textContent=Math.round(sc*100)+'%'; }
function resetT(){ sc=1;tx=0;ty=0;applyT(); }
function setScale(n){ sc=Math.min(8,Math.max(1,n)); if(sc===1){tx=0;ty=0;} applyT(); }

function openReview(){ show('s3'); renderReview(); }
function renderReview(){
  const it=photos[cur]; if(!it) return;
  big.src=it.url;
  const fmt=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB';
  const showInfo=()=>{ const w=big.naturalWidth,h=big.naturalHeight; $('pinfo').textContent=(w&&h?w+'×'+h+' px · ':'')+fmt(it.blob.size); };
  $('pinfo').textContent=fmt(it.blob.size);
  if(big.complete && big.naturalWidth) showInfo(); else big.onload=()=>{ if(photos[cur]===it) showInfo(); };
  $('info').textContent=(cur+1)+' / '+photos.length+'  '+ICON[it.state];
  $('prev').disabled=cur===0; $('next').disabled=cur===photos.length-1;
  $('retry').style.display = it.state==='err'?'':'none';
  if(!big.dataset.k || big.dataset.k!==it.url){ big.dataset.k=it.url; resetT(); }
}
$('back').onclick=()=>{ show('s2'); };
$('prev').onclick=()=>{ if(cur>0){cur--;renderReview();} };
$('next').onclick=()=>{ if(cur<photos.length-1){cur++;renderReview();} };
$('zi').onclick=()=>setScale(sc*1.5);
$('zo').onclick=()=>setScale(sc/1.5);
$('retry').onclick=()=>{ const it=photos[cur]; if(it) upload(it); };

$('del').onclick=async()=>{
  const it=photos[cur]; if(!it) return;
  if(!confirm('確定刪除這張照片？（雲端硬碟中的檔案也會移到垃圾桶）')) return;
  it.deleted=true;
  if(it.id){ api({action:'delete',id:it.id}).catch(()=>toast('雲端刪除失敗，請至雲端硬碟手動刪除')); }
  photos.splice(cur,1); URL.revokeObjectURL(it.url); big.dataset.k='';
  renderThumb();
  if(!photos.length){ show('s2'); toast('已刪除'); return; }
  if(cur>=photos.length) cur=photos.length-1;
  renderReview(); toast('已刪除');
};

/* 手指縮放 / 拖曳 / 雙擊 */
const stage=$('stage'), ptrs=new Map(); let d0=0,s0=1,lastTap=0;
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; d0=Math.hypot(a.x-b.x,a.y-b.y); s0=sc; }
  if(ptrs.size===1){ const n=Date.now(); if(n-lastTap<300){ setScale(sc>1?1:2.5); } lastTap=n; }
});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const ox=p.x, oy=p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; setScale(s0*Math.hypot(a.x-b.x,a.y-b.y)/d0); }
  else if(sc>1){ tx+=p.x-ox; ty+=p.y-oy; applyT(); }
});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{ ptrs.delete(e.pointerId); }));
stage.addEventListener('wheel',e=>{ e.preventDefault(); setScale(sc*(e.deltaY<0?1.15:1/1.15)); },{passive:false});

/* ---------- 4. 掃描（直接在輸入框內進行） ---------- */
let sStream=null, sTimer=null, h5=null, scanned=false, scanTarget='order', scanId=0;
const sv=$('sv'), sbox=$('scanBox');
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }

async function startScan(target){
  cancelGo();
  if(target==='order' && $('order').readOnly) return;
  await closeScan();
  const my=++scanId;
  scanTarget=target; scanned=false;
  $(target).parentElement.appendChild(sbox);     // 掃描畫面疊在該輸入框上，大小與框相同
  sbox.style.display='block'; syncOcrUI();
  if('BarcodeDetector' in window){
    try{
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:ocrOn.checked?1920:1280},height:{ideal:ocrOn.checked?1080:720},advanced:[AF]},audio:false});
      await autoFocus(st.getVideoTracks()[0]);
      if(my!==scanId){ st.getTracks().forEach(t=>t.stop()); return; }
      sStream=st; sv.srcObject=st; sv.style.display='block'; $('reader').style.display='none';
      const det=new BarcodeDetector();
      sTimer=setInterval(async()=>{ try{ const r=await det.detect(sv); if(r.length) gotScan(r[0].rawValue); }catch(e){} },250);
      ocrLoop(my);
      return;
    }catch(e){}
  }
  sv.style.display='none'; $('reader').style.display='block';
  try{
    if(!window.Html5Qrcode) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js');
    if(my!==scanId) return;
    const q=new Html5Qrcode('reader'); h5=q;
    await q.start({facingMode:'environment'},{fps:10,videoConstraints:{facingMode:'environment',advanced:[AF]}},t=>gotScan(t));
    if(my!==scanId){ closeScan(); } else { const t0=curTrack(); if(t0) autoFocus(t0); ocrLoop(my); }
  }catch(e){ if(my===scanId){ toast('無法啟動掃描，請點框手動輸入'); await closeScan(); } }
}
/* ---------- 4b. 文字 OCR（掃不到條碼、影像是文字時啟動） ----------
   OCR 引擎：與 AAEON Windows License Scanner 相同的 OCR.space API（OCREngine 2）
   辨識邏輯：取「:」之後、「-」之前的字串，例如 Job：TFF2608552-BOXER-6641… → TFF2608552 */
const ocrOn=$('ocrOn');
ocrOn.checked=false;                                           // 每次開啟頁面預設關閉 OCR（不記憶開關）
let frm={w:92,h:72,t:50,k:8,v:2};                                      // 紅框：寬%、高%、上下位置%
try{ const o=JSON.parse(localStorage.getItem('ocrFrame')||'null'); if(o&&o.w){ const k0=frm.k; frm=Object.assign(frm,o); if(o.v!==2){ frm.k=k0; frm.v=2; } } }catch(e){}   // 舊版存的 10KB 一律改用新預設 8KB
function applyFrame(){
  const b=$('ocrBox').style;
  b.setProperty('--fw',frm.w+'%'); b.setProperty('--fh',frm.h+'%');
  b.setProperty('--fl',((100-frm.w)/2)+'%'); b.setProperty('--ft',((100-frm.h)*frm.t/100)+'%');
  $('fK').value=frm.k;
  $('fW').value=frm.w; $('fH').value=frm.h; $('fT').value=frm.t;
  $('fWv').textContent=frm.w+'%'; $('fHv').textContent=frm.h+'%'; $('fTv').textContent=frm.t+'%';
}
[['fW','w'],['fH','h'],['fT','t'],['fK','k']].forEach(([id,k])=>$(id).addEventListener('input',e=>{
  frm[k]=+e.target.value; applyFrame();
  try{ localStorage.setItem('ocrFrame',JSON.stringify(frm)); }catch(e){}
}));
function syncOcrUI(){
  const on=ocrOn.checked && scanTarget==='order';
  $('ocrBox').style.display=on?'block':'none';
  $('scanHint').textContent=on?'將 Job: 那一行對準紅框 ／ 點此手動輸入':'掃描中…點此手動輸入';
  $('frmSet').style.display=ocrOn.checked?'grid':'none';
  $('ocrLog').style.display=ocrOn.checked?'block':'none';
}
applyFrame(); syncOcrUI();
ocrOn.addEventListener('change',()=>{
  toast(ocrOn.checked?'OCR 已開啟':'OCR 已關閉');
  syncOcrUI();
  if($('s1').classList.contains('on') && sbox.style.display==='block' && scanTarget==='serial') return;   // 正在掃序號：OCR 不適用，不打斷
  if($('s1').classList.contains('on') && !$('order').readOnly) startScan('order');   // 重新啟動工單框相機並套用 OCR 設定
});
const OCR_SPACE_API_KEY='K84865808588957';
const OCR_MAX_TRIES=20, OCR_GAP=700;      // 每次掃描最多送 20 次、間隔 0.7 秒、可同時 3 張（只送紅框小圖），避免耗盡 API 額度
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function parseJob(txt){
  const t=(txt||'').replace(/[：﹕]/g,':').replace(/[–—－﹣‐‑]/g,'-');
  // 標籤容許 OCR 誤判：Job / JOB / J0b / Jo8 / Jab / J0B …；冒號可誤判成 ; . , | !，也可能被漏掉
  const m=t.match(/J\s?[oO0aAeEuU@8]\s?[bB68hH]\s*[:;.,|!]?\s*([A-Za-z0-9]+)\s*-/);
  if(!m) return '';
  let id=m[1].toUpperCase();
  const k=id.search(/[0-9]/);                                   // 第一個數字之後應全為數字：修正 O→0、I/L→1
  if(k>0){
    const fixed=id.slice(0,k)+id.slice(k).replace(/O/g,'0').replace(/[IL]/g,'1');
    if(/^[A-Z]+[0-9]+$/.test(fixed)) id=fixed;
  }
  return (id.length>=5 && /\d/.test(id)) ? id : '';            // 過短或無數字視為誤判
}
let ocrMetric=null;
function ocrFrame(){                                           // 只擷取紅框範圍 → JPEG base64（影像小、辨識快）
  const vid=(sv.style.display!=='none' && sv.videoWidth)?sv:document.querySelector('#reader video');
  if(!vid || !vid.videoWidth) return null;
  const c=sbox.getBoundingClientRect(), f=$('ocrBox').getBoundingClientRect();
  if(!c.width||!c.height||!f.width) return null;
  const vw=vid.videoWidth, vh=vid.videoHeight;
  const sc=Math.max(c.width/vw, c.height/vh);                  // object-fit:cover 縮放比
  const ox=(vw*sc-c.width)/2, oy=(vh*sc-c.height)/2;           // 被裁掉的邊
  let sx=(f.left-c.left+ox)/sc, sy=(f.top-c.top+oy)/sc, sw=f.width/sc, sh=f.height/sc;
  sx=Math.max(0,sx); sy=Math.max(0,sy); sw=Math.min(sw,vw-sx); sh=Math.min(sh,vh-sy);
  const k=Math.min(1,700/sw);                                 // 縮小上傳尺寸，加快傳輸與辨識
  const cv=document.createElement('canvas'); cv.width=Math.round(sw*k); cv.height=Math.round(sh*k);
  const cx=cv.getContext('2d'); try{ cx.filter='grayscale(1) contrast(1.4)'; }catch(e){}
  cx.drawImage(vid,sx,sy,sw,sh,0,0,cv.width,cv.height);
  try{                                                         // 本機快速檢查：亮度與清晰度（邊緣強度），避免送出空白/模糊畫面
    const w=160, h=Math.max(8,Math.round(cv.height*w/cv.width));
    const sm=document.createElement('canvas'); sm.width=w; sm.height=h;
    const sx2=sm.getContext('2d'); sx2.drawImage(cv,0,0,w,h);
    const px=sx2.getImageData(0,0,w,h).data, g=new Float32Array(w*h);
    let sum=0; for(let i=0;i<w*h;i++){ g[i]=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2]; sum+=g[i]; }
    let ed=0; for(let y=0;y<h-1;y++) for(let x=0;x<w-1;x++){ const i=y*w+x; ed+=Math.abs(g[i]-g[i+1])+Math.abs(g[i]-g[i+w]); }
    ocrMetric={bright:Math.round(sum/(w*h)), sharp:+(ed/(w*h)).toFixed(1)};
  }catch(e){ ocrMetric=null; }
  return cv.toDataURL('image/jpeg',0.7);
}
function curTrack(){
  const v=(sv.style.display!=='none' && sv.srcObject)?sv:document.querySelector('#reader video');
  return v && v.srcObject && v.srcObject.getVideoTracks()[0];
}
async function refocus(){                                      // 對紅框中心重新對焦一次，再回到連續自動對焦
  const t=curTrack(); if(!t) return;
  try{
    const c=t.getCapabilities?t.getCapabilities():{};
    if(c.focusMode && c.focusMode.includes('single-shot')){
      const a={focusMode:'single-shot'};
      if(c.pointsOfInterest){
        const vid=(sv.style.display!=='none')?sv:document.querySelector('#reader video');
        const cb=sbox.getBoundingClientRect(), fb=$('ocrBox').getBoundingClientRect();
        const sc=Math.max(cb.width/vid.videoWidth, cb.height/vid.videoHeight);
        const ox=(vid.videoWidth*sc-cb.width)/2, oy=(vid.videoHeight*sc-cb.height)/2;
        const x=((fb.left+fb.width/2-cb.left+ox)/sc)/vid.videoWidth, y=((fb.top+fb.height/2-cb.top+oy)/sc)/vid.videoHeight;
        a.pointsOfInterest=[{x:Math.min(1,Math.max(0,x)),y:Math.min(1,Math.max(0,y))}];
      }
      await t.applyConstraints({advanced:[a]});
      await sleep(600);                                        // 等對焦完成
    }
  }catch(e){}
  await autoFocus(t);                                          // 回到連續自動對焦
}
const OCR_FALLBACK_MS=5000;                    // 保底等待時間：連續這麼久沒有達標畫面，就送出期間最大的一張
let ocrN=0, ocrLines=[];
function ocrLog(line,wait){
  if(ocrLines.length && ocrLines[0].startsWith('…')) ocrLines.shift();   // 等待訊息只保留最新一行
  ocrLines.unshift(line); ocrLines=ocrLines.slice(0,6);
  $('ocrLog').innerHTML=ocrLines.map(x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>');
}
async function ocrCall(img,my,mt,tag){
  const no=++ocrN, lb='#'+no+(tag?'（保底）':''), t0=performance.now(), kb=Math.round(img.length*0.75/1024);
  const sec=()=>((performance.now()-t0)/1000).toFixed(1)+'s';
  try{
    const fd=new FormData();
    fd.append('base64Image',img); fd.append('apikey',OCR_SPACE_API_KEY);
    fd.append('language','eng'); fd.append('OCREngine','2');
    const r=await fetch('https://api.ocr.space/parse/image',{method:'POST',body:fd});
    if(!r.ok){ ocrLog(lb+' '+sec()+' ✖ HTTP '+r.status+'（'+kb+'KB）'); return; }
    const d=await r.json();
    if(d.IsErroredOnProcessing){ ocrLog(lb+' '+sec()+' ✖ 服務錯誤：'+[].concat(d.ErrorMessage||d.ErrorDetails||'').join(' ').slice(0,80)); return; }
    const raw=(d.ParsedResults||[]).map(p=>p.ParsedText||'').join('\n');
    const id=parseJob(raw);
    ocrLog(lb+' '+sec()+' '+kb+'KB'+(mt?' s'+mt.sharp+' b'+mt.bright:'')+' '+(id?'✔ '+id:'✖ 原文：「'+(raw.replace(/\s+/g,' ').trim().slice(0,70)||'（空白）')+'」'));
    if(my!==scanId || scanned || !ocrOn.checked) return;
    if(id && scanTarget==='order') gotScan(id,true);             // OCR 結果只會填入工單欄
  }catch(e){ ocrLog(lb+' '+sec()+' ✖ 連線失敗：'+(e&&e.message||e)); }
}
async function ocrLoop(my){
  if(!ocrOn.checked || scanTarget!=='order') return;           // 未開啟 OCR，或不是工單欄位 → 不啟動
  ocrN=0; ocrLines=[]; $('ocrLog').textContent='OCR 紀錄：辨識中…';
  await refocus();                                             // 先對紅框對焦再開始辨識
  let inflight=0, sent=0, it=0, best={kb:0}, lastSend=performance.now(); const tStart=performance.now();                                      // 不等上一張回應就送下一張（最多同時 3 張）
  while(sent<OCR_MAX_TRIES && it<80 && my===scanId && !scanned && ocrOn.checked && scanTarget==='order'){
    if(it++>0 && it%7===1 && inflight===0){ await refocus(); if(my!==scanId||scanned) return; }   // 約每 5 秒重新對焦
    if(inflight<3){
      const img=ocrFrame();
      const kb=img?Math.round(img.length*0.75/1024):0;
      if(img && kb>best.kb) best={kb,img,mt:ocrMetric};              // 記住這段時間內最大（最清楚）的一張
      const ready=kb>=(+frm.k||0);                                // 圖片小於設定的 KB（通常是空白/模糊畫面）就不送
      const stale=(performance.now()-lastSend)>OCR_FALLBACK_MS;   // 保底：超過 5 秒都沒有達標的畫面
      if(img && ready){ sent++; inflight++; lastSend=performance.now(); best={kb:0}; ocrCall(img,my,ocrMetric).finally(()=>inflight--); }
      else if(stale && best.img){ sent++; inflight++; lastSend=performance.now(); const b=best; best={kb:0}; ocrCall(b.img,my,b.mt,true).finally(()=>inflight--); }
      else if(img){ ocrLog('… 圖片 '+kb+'KB < '+frm.k+'KB，不送出，等待清晰畫面', true); }
    }
    await sleep(OCR_GAP);
  }
}
async function closeScan(){
  scanId++;
  clearInterval(sTimer);
  if(sStream){ sStream.getTracks().forEach(t=>t.stop()); sStream=null; }
  if(h5){ const q=h5; h5=null; try{await q.stop();}catch(e){} try{q.clear();}catch(e){} }
  sbox.style.display='none';
}
let goTimer=null;
function cancelGo(){ if(goTimer){ clearTimeout(goTimer); goTimer=null; } $('pend').style.display='none'; }
function scheduleGo(){                           // 序號掃到後不自動跳轉，只在綠框顯示讀到的字串（字級自動縮放填滿綠框）
  const el=$('pend');
  el.textContent=$('serial').value;
  el.style.display='flex';
  let fs=44; el.style.fontSize=fs+'px';
  const maxW=el.clientWidth-24;
  const sp=document.createElement('span'); sp.style.cssText='display:inline-block'; sp.textContent=el.textContent;
  el.textContent=''; el.appendChild(sp);
  while(fs>10 && sp.offsetWidth>maxW){ fs-=1; el.style.fontSize=fs+'px'; }
}
$('pend').onclick=()=>{ $('pend').style.display='none'; };
$('serial').addEventListener('focus',cancelGo);
$('serial').addEventListener('input',cancelGo);
const SERIAL_DELAY=1500;                       // 工單掃完 → 序號相機開啟前的停頓（毫秒）
async function gotScan(t,fromOcr){
  if(scanned) return;
  if(scanTarget==='order' && ocrOn.checked && !fromOcr) return;   // 開啟 OCR 時，工單欄只接受 Job: 的 OCR 結果，忽略條碼
  if(scanTarget==='serial' && t===$('order').value) return;     // 切換瞬間仍對著工單條碼，不要誤填進序號
  scanned=true;
  const tg=scanTarget; $(tg).value=t; toast('已讀取：'+t);
  await closeScan();
  if(tg==='serial') scheduleGo();             // 序號掃到後：只顯示提示，不自動跳轉
  else{                                         // 工單掃到後：停頓 1.5 秒（讓人移到序號條碼），再開啟序號相機
    const my=scanId;
    await sleep(SERIAL_DELAY);
    if(my===scanId && $('s1').classList.contains('on')) startScan('serial');
  }
}
sbox.onclick=async()=>{ const t=scanTarget; await closeScan(); $(t).focus(); };   // 點框 → 改手動輸入
$('scanOrder').onclick=()=>startScan('order');
$('scanSerial').onclick=()=>startScan('serial');

document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  setTimeout(()=>{
    ensureCam();
    if($('s1').classList.contains('on') && sbox.style.display==='block'){
      const t=sStream&&sStream.getVideoTracks()[0];
      if(!t||t.readyState!=='live') startScan(scanTarget);
    }
  },300);
});
startScan('order');   // 一開啟就在工單框內掃描
window.addEventListener('beforeunload',e=>{ if(busy||queue.length){ e.preventDefault(); e.returnValue=''; } });
</script>
